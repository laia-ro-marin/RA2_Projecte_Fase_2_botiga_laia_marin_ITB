<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <h1>Exclusivos Play</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Catàleg</a></li>
                <li><a href="fitxa.html">Fitxa de joc</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="seccion_contacto">
        <h2>Contacta amb nosaltres</h2>

        <form class="formulario_contacto">

            <label for="nombre">Nom:</label>
            <input type="text" id="nombre" name="nombre" placeholder="El teu nom" required>

            <label for="correo">Correu electrònic:</label>
            <input type="email" id="correo" name="correo" placeholder="El teu correu electrònic" required>

            <label for="asunto">Assumpte:</label>
            <input type="text" id="asunto" name="asunto" placeholder="De què ens vols parlar?" required>

            <label for="mensaje">Missatge:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escriu el teu missatge" required></textarea>

            <button type="submit">Enviar missatge</button>

        </form>
    </section>
    <footer class="contacte_footer">
        <p>Laia Marin</p>
    </footer>
</body>
