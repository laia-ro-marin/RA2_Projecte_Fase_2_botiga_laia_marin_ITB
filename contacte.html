<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusivos Play</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Exclusivos Play</h1>
        <nav>
            <ul>
                <li><a href="index.html">Catàleg</a></li>
                <li><a href="fitxa.html">Fitxa de joc</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
        <button id="btn_tema">Canviar tema</button>
    </header>
    
    <section class="seccion_contacto">
        <h2>Contacta amb nosaltres</h2>

        <form id="form" class="formulario_contacto" novalidate>

            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="El teu nom" required>

            <label for="mail">Correu electrònic:</label>
            <input type="email" id="mail" name="mail" placeholder="El teu correu electrònic" required>

            <label for="assumpte">Assumpte:</label>
            <input type="text" id="assumpte" name="assumpte" placeholder="De què ens vols parlar?" required>

            <label for="missatge">Missatge:</label>
            <textarea id="missatge" name="missatge" rows="5" placeholder="Escriu el teu missatge" required></textarea>
            
            <p id="comptador_caracters">0 / 300 caràcters</p>

            <button type="submit">Enviar missatge</button>

        </form>
        <div id="resum"></div>
    </section>
    <footer class="contacte_footer">
        <p>Laia Marin</p>
    </footer>
</body>
